<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Orbital Signals — an interactive Three.js Earth study with texture mapping, atmosphere and orbital controls.">
<title>Orbital Signals — Interactive Earth</title>
</head>
<body>
<main class="study-shell">
  <section class="study-copy">
    <p class="eyebrow">THREE.JS STUDY / 01</p>
    <h1>Orbital <span class="accent">Signals</span></h1>
    <p>An interactive Earth study built around texture mapping, atmospheric falloff and a quiet orbital camera.</p>
    <p class="hint">Drag to orbit · Scroll to zoom · The Earth spins on its own.</p>
  </section>

  <div id="canvasContainer">
    <canvas class="webgl" aria-label="Interactive rotating Earth"></canvas>
  </div>

  <aside class="controls-panel" aria-label="Scene controls">
    <strong>Controls</strong>
    <span>drag / zoom</span>
    <button type="button" data-reset-view>Reset view</button>
  </aside>
</main>
</body>
</html>
