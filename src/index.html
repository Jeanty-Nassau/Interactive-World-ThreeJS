<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Orbital Signals — an interactive night-side Earth study with topology relief, city-light emission and orbital traces.">
  <title>Orbital Signals — Interactive Earth</title>
</head>
<body>
  <main class="study-shell">
    <section class="study-copy">
      <p class="eyebrow">THREE.JS STUDY / 01</p>
      <h1>Orbital <span>Signals</span></h1>
      <p>A night-side Earth reinterpreted as a moving signal object: topology relief, glowing cities, layered atmosphere and orbiting traces.</p>
      <p class="hint">Drag to orbit · Scroll to zoom.</p>
    </section>

    <div id="canvasContainer">
      <canvas class="webgl" aria-label="Interactive night-side Earth"></canvas>
    </div>

    <aside class="controls-panel">
      <strong>Controls</strong>
      <span>drag / zoom</span>
      <button type="button" data-reset-view>Reset</button>
    </aside>
  </main>
</body>
</html>
